<path d="M990 673 H1032 V373 H997" class="arrow" stroke-dasharray="6 5"/>
<text class="small" text-anchor="middle" transform="translate(17 523) rotate(-90)">Unresolved → reobserve and revise</text>
<text class="small" text-anchor="middle" transform="translate(1052 523) rotate(90)">Unresolved → scripted retry</text>
<text x="265" y="755" class="small" text-anchor="middle">Next correction requires model judgment</text>
<text x="795" y="755" class="small" text-anchor="middle">Alignment and contact corrections stay in code</text>
