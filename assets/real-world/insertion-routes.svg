<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="970" viewBox="0 0 1060 970" role="img" aria-labelledby="title desc">
<title id="title">Ethernet insertion: Astra and Fable 5.1 technical routes</title>
<desc id="desc">Astra reviews current images and selects motion corrections, then a controller performs incremental motion and scripts check insertion. If unresolved, feedback returns to model review. Fable 5.1 uses scripted visual servo alignment, axial-force control with lateral and rotational admittance, and scripted seating checks and retries. The selected recordings show five of five mechanical insertions for Astra and zero of five for Fable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b876d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242923} .heading{font-size:27px;font-weight:700}.sub{font-size:18px;fill:#656a61}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#656a61}.arrow{fill:none;stroke:#7b876d;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1060" height="970" fill="#f5f4ef"/>

