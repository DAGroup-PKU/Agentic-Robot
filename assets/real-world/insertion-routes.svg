<rect x="70" y="319" width="390" height="111" rx="10" fill="#b8492b" stroke="#963d25"/>
<text x="265" y="355" text-anchor="middle" style="fill:#ffffff;font-size:23px;font-weight:800;letter-spacing:0.3px">ONLINE MODEL DECISION</text>
<text x="265" y="383" text-anchor="middle" style="fill:#f5f4ef;font-size:17px;font-weight:400">Inspect images → choose correction</text>
<text x="265" y="407" text-anchor="middle" style="fill:#f5f4ef;font-size:17px">Specify direction + distance</text>
