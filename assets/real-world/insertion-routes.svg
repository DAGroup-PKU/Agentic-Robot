<text x="265.0" y="168" class="body" text-anchor="middle">Waypoints + clearance</text>
<text x="265.0" y="194" class="body" text-anchor="middle">Grasp → check → lift</text>
<text x="265.0" y="220" class="body" text-anchor="middle">Tool + target geometry</text>
<rect x="600" y="108" width="390" height="136" rx="10" fill="#eceee6" stroke="#d8dad0"/>
<text x="795.0" y="139" class="label" text-anchor="middle">Prepare the approach</text>
<text x="795.0" y="168" class="body" text-anchor="middle">Plug + socket localization</text>
<text x="795.0" y="194" class="body" text-anchor="middle">Tip estimate: stereo + depth</text>
<text x="795.0" y="220" class="body" text-anchor="middle">Pick → rotate → regrasp</text>
<path d="M265 244 V267" class="arrow"/>
<path d="M795 244 V267" class="arrow"/>
<rect x="51" y="275" width="428" height="496" rx="13" fill="#e7eae1"/>
<rect x="581" y="275" width="428" height="496" rx="13" fill="#eceee6"/>
<text x="265" y="298" class="small" text-anchor="middle">FINAL ALIGNMENT AND INSERTION</text>
<text x="795" y="298" class="small" text-anchor="middle">FINAL ALIGNMENT AND INSERTION</text>
