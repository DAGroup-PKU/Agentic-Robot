<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="title desc"><title id="title">General pickup: observation to action</title><desc id="desc">Simplified source-based flow through object selection, RGB geometry, planning and checks, waypoint execution and robot actions. Feedback returns to observation. Conditional neural branches are omitted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#66847b"/></marker></defs><rect width="560" height="290" rx="12" fill="#f4f7f0"/><g fill="none" stroke="#66847b" stroke-width="2" marker-end="url(#arrow)"><path d="M164 70H201"/><path d="M352 70H389"/><path d="M466 106V181"/><path d="M390 217H353"/><path d="M202 217H165"/><path d="M88 181V107" stroke-dasharray="5 5"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17363b"><g><rect x="14" y="34" width="150" height="72" rx="8" fill="#fff" stroke="#d0d9ce"/><text x="89" y="64" font-size="17">RGB + instruction</text><text x="89" y="87" font-size="13" fill="#637276">Observe</text></g><g><rect x="202" y="34" width="150" height="72" rx="8" fill="#e3f0ea" stroke="#86afa0"/><text x="277" y="64" font-size="17">Object selection</text><text x="277" y="87" font-size="13" fill="#637276">Perception</text></g><g><rect x="390" y="34" width="150" height="72" rx="8" fill="#e3f0ea" stroke="#86afa0"/><text x="465" y="64" font-size="17">Grasp geometry</text><text x="465" y="87" font-size="13" fill="#637276">Camera geometry</text></g><g><rect x="390" y="181" width="150" height="72" rx="8" fill="#f6ebdc" stroke="#cda478"/><text x="465" y="211" font-size="17">Plan + checks</text><text x="465" y="234" font-size="13" fill="#637276">IK · clearance</text></g><g><rect x="202" y="181" width="150" height="72" rx="8" fill="#e8ecf4" stroke="#a6b1ca"/><text x="277" y="211" font-size="17">Motion execution</text><text x="277" y="234" font-size="13" fill="#637276">Waypoints · gripper</text></g><g><rect x="14" y="181" width="150" height="72" rx="8" fill="#fff" stroke="#d0d9ce"/><text x="89" y="211" font-size="17">Robot actions</text><text x="89" y="234" font-size="13" fill="#637276">Approach · lift</text></g><text x="89" y="147" font-size="13" fill="#637276" stroke="#f4f7f0" stroke-width="7" paint-order="stroke">Feedback</text></g></svg>
